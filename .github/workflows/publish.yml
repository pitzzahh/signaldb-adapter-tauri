name: Publish Package to npmjs
on:
  push:
    branches: [main, 'maintenance/**']
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Old maintenance lines have no typecheck/size scripts; tests always run.
      - name: Verify (tests + configured gates)
        run: |
          bun run test
          if node -p "Boolean(require('./package.json').scripts?.typecheck)" | grep -q '^true$'; then
            bun run typecheck
          else
            echo "No typecheck script on this line, skipping."
          fi
          if node -p "Boolean(require('./package.json').scripts?.size)" | grep -q '^true$'; then
            bun run size
          else
            echo "No size script on this line, skipping."
          fi

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Dist-tag rule: a version newer than registry latest goes to latest
          # (mainline); anything else goes to lts-<major.minor> so maintenance
          # releases never move latest. Works for branch pushes, tag releases,
          # and manual dispatches on any line.
          LATEST=$(npm view @pitzzahh/signaldb-adapter-tauri version 2>/dev/null || echo "0.0.0")
          NEWEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -n 1)
          if [ "$NEWEST" = "$VERSION" ] && [ "$VERSION" != "$LATEST" ]; then
            TAG="latest"
          else
            TAG="lts-$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Skip only when this exact version is already in the registry.
          # (Comparing against latest would republish old lines forever.)
          if npm view "@pitzzahh/signaldb-adapter-tauri@${VERSION}" version 2>/dev/null | grep -qF "$VERSION"; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published, skipping."
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Will publish $VERSION with dist-tag $TAG."
          fi

      - name: Extract changelog entry for this version
        id: changelog
        if: steps.check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          # Extract everything between "## [VERSION]" and the next "## ["
          # Escape dots so 2.3.0 does not match 2x3y0.
          ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          BODY=$(awk "/^## \[$ESCAPED\]/{flag=1; next} /^## \[/{if(flag) exit} flag" CHANGELOG.md)
          # Write to file to avoid escaping issues
          echo "$BODY" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> $GITHUB_OUTPUT

      # Sigstore Rekor 409s are transient; retry with re-probe (see 2.4.1 release).
      - name: Publish to npm (retries Sigstore flakes)
        if: steps.check.outputs.should_publish == 'true'
        run: |
          for attempt in 1 2 3; do
            if npm publish --provenance --access public --tag "${{ steps.check.outputs.tag }}"; then
              exit 0
            fi
            VERSION="${{ steps.check.outputs.version }}"
            if npm view "@pitzzahh/signaldb-adapter-tauri@${VERSION}" version 2>/dev/null | grep -qF "$VERSION"; then
              echo "Version $VERSION is already on the registry; treating publish as done."
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Publish failed after 3 attempts."
              exit 1
            fi
            echo "Publish attempt $attempt failed; retrying in 60 seconds."
            sleep 60
          done

      - uses: softprops/action-gh-release@v3
        if: steps.check.outputs.should_publish == 'true' && github.event_name != 'release'
        with:
          tag_name: v${{ steps.check.outputs.version }}
          # The GitHub API defaults new tags to the default branch, which
          # mistargets maintenance releases. Pin to the built commit.
          target_commitish: ${{ github.sha }}
          # Only mainline releases take the Latest badge.
          make_latest: ${{ steps.check.outputs.tag == 'latest' }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          generate_release_notes: false
