name: Publish Package to npmjs
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @pitzzahh/signaldb-adapter-tauri version 2>/dev/null || echo "0.0.0")
          if [ "$VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published, skipping."
          fi

      - name: Extract changelog entry for this version
        id: changelog
        if: steps.check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          # Extract everything between "## [VERSION]" and the next "## ["
          BODY=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{if(flag) exit} flag" CHANGELOG.md)
          # Write to file to avoid escaping issues
          echo "$BODY" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> $GITHUB_OUTPUT

      - run: npm publish --provenance --access public
        if: steps.check.outputs.should_publish == 'true'

      - uses: softprops/action-gh-release@v3
        if: steps.check.outputs.should_publish == 'true' && github.event_name != 'release'
        with:
          tag_name: v${{ steps.check.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          generate_release_notes: false
